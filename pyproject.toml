[project]
name = "schedule-bot"
version = "0.1.0"
description = "VK schedule docx -> ElJur homework -> Telegram"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.20.0",
    "aiohttp-socks>=0.9.0",
    "pydantic-settings>=2.0.0",
    "python-docx>=1.1.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "aiofiles>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
